name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, no dependencies installed)
        run: python -m unittest discover -s tests -v
      - name: Every env loads and its oracle solves it
        run: |
          python -m navital_gym.cli list
          python -m navital_gym.cli run --env trip --agent oracle
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the optional extras
        run: pip install -e ".[inspect,verifiers,openenv]"
      - name: Adapter tests (offline, scripted models)
        run: python -m unittest tests.test_adapter_inspect tests.test_adapter_verifiers tests.test_adapter_openenv -v
