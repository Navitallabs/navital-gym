[project]
name = "navital-gym"
version = "1.1.0"
description = "Navital Gym: deterministic, auto-graded environments for AI agents doing Indian-reality tasks (Navital Labs)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA", "NOTICE"]
authors = [{ name = "Navital Labs", email = "dakshbathla@navitallabs.com" }]
keywords = ["ai-agents", "evaluation", "benchmark", "india", "tool-use", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # the core and every env are standard library only

[project.urls]
Homepage = "https://navitallabs.com/labs/navital-gym"
Repository = "https://github.com/Navitallabs/navital-gym"
Issues = "https://github.com/Navitallabs/navital-gym/issues"
Changelog = "https://github.com/Navitallabs/navital-gym/blob/main/CHANGELOG.md"
Results = "https://github.com/Navitallabs/navital-gym/blob/main/docs/RESULTS.md"

[project.scripts]
navital-gym = "navital_gym.cli:main"

[project.optional-dependencies]
verifiers = ["verifiers"]
inspect = ["inspect-ai"]
openenv = ["openenv-core"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["navital_gym*"]
[tool.setuptools.package-data]
"navital_gym.envs.trip" = ["tasks.jsonl", "tasks_easy.jsonl", "*.json", "*.md"]   # tasks_source.jsonl is the build input, not shipped
"navital_gym.envs.form" = ["*.jsonl", "*.json", "*.md"]
"navital_gym.envs.form_multidoc" = ["*.jsonl", "*.json", "*.md"]
"navital_gym.envs.support" = ["*.jsonl", "*.json", "*.md"]
"navital_gym.envs.gst" = ["*.jsonl", "*.json", "*.md"]
"navital_gym.envs.upi" = ["*.jsonl", "*.json", "*.md"]
